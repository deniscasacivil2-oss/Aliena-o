<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Olímpia 2026 - Alienação de Imóveis</title>
        
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .sidebar { background-color: #003366; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05); border: 1px solid #e2e8f0; }
        .nav-link { transition: all 0.2s; border-radius: 8px; }
        .nav-link.active { background-color: #ffb800; color: #003366 !important; font-weight: 700; }
        .text-navy { color: #003366; }
        .bg-navy { background-color: #003366; }
        .text-gold { color: #ffb800; }
        .bg-gold { background-color: #ffb800; }
        .border-gold { border-color: #ffb800; }
        .section-content { display: none; }
        .section-content.active { display: block; animation: fadeIn 0.35s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .logo-container img { object-fit: contain; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .status-cell { height: 1px; padding: 0 !important; }
        .status-cell > div { min-height: 100%; height: 100%; }
        .sidebar-content { min-width: 256px; }
        .leaflet-container { z-index: 10 !important; font-family: 'Poppins', sans-serif; }
        .modern-map-popup .leaflet-popup-content-wrapper { border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.2); }
        .modern-map-popup .leaflet-popup-tip { background-color: white; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; }
        .modern-map-popup .leaflet-popup-content { margin: 8px 14px; }
        .custom-marker { background: transparent; border: none; }
        
        /* Chart container constraint specification */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            height: 320px;
            max-height: 400px;
        }
        @media (min-width: 768px) {
            .chart-container { height: 350px; }
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar text-white flex-shrink-0 flex flex-col transition-all duration-300 w-64 overflow-hidden h-screen sticky top-0 z-50">
        <div class="sidebar-content flex flex-col h-full">
            <div class="p-6 text-center border-b border-blue-900">
                <div class="bg-white p-2 rounded-lg mb-3 inline-block logo-container shadow-lg">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/Bras%C3%A3o_de_Ol%C3%ADmpia%2C_SP.jpg" alt="Brasão de Olímpia" class="h-14 mx-auto">
                </div>
                <h2 class="text-[11px] font-bold tracking-widest uppercase text-blue-100 leading-tight px-1">Alienação de Imóveis Públicos</h2>
                <p class="text-[9px] text-amber-300 uppercase tracking-wider mt-1">Gestão de Patrimônio</p>
            </div>
            
            <nav id="menu-lateral" class="flex-grow p-4 space-y-2 mt-2 overflow-y-auto no-scrollbar">
                <div class="animate-pulse flex items-center space-x-3 p-3">
                    <div class="rounded-full bg-blue-800 h-6 w-6"></div>
                    <div class="h-4 bg-blue-800 rounded w-3/4"></div>
                </div>
            </nav>

            <div class="p-5 bg-blue-950 text-[10px] text-blue-300 mt-auto border-t border-blue-900">
                <p class="font-bold text-white mb-0.5">Divisão de Governança, Processo e Projetos Estratégicos</p>
                <p>Casa Civil | Município de Olímpia - SP</p>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col min-w-0 w-full">
        <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 md:px-8 sticky top-0 z-40 shadow-sm">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="text-navy hover:text-blue-600 transition-colors focus:outline-none" aria-label="Alternar Menu">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 id="page-title" class="text-lg md:text-xl font-extrabold text-navy uppercase tracking-tight truncate">Carregando Painel...</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span class="bg-blue-100 text-navy px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest hidden sm:inline-block">Exercício 2026</span>
                <div class="h-9 w-9 rounded-full bg-navy text-gold flex items-center justify-center font-black text-xs shadow-md border-2 border-gold" title="Município de Olímpia">OP</div>
            </div>
        </header>

        <div id="conteiner-secoes" class="p-4 md:p-8 w-full mx-auto max-w-[1400px]">
            <div class="flex flex-col items-center justify-center h-64 text-navy mt-16">
                <i class="fa-solid fa-spinner fa-spin text-5xl mb-4 text-gold"></i>
                <h2 class="text-lg font-bold uppercase tracking-widest">Sincronizando Dados Municipais</h2>
                <p class="text-xs text-gray-500 mt-1">Carregando registros de patrimônio e leilões...</p>
            </div>
        </div>
    </main>

    <script>
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        function normalizeStr(str) {
            if (!str) return '';
            return String(str).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.replace('w-64', 'w-0');
            } else {
                sidebar.classList.replace('w-0', 'w-64');
            }
        }

        const url = 'https://script.google.com/macros/s/AKfycbxnNmixDLG8IeBBnamPT9WeLSbx2725YKnXhuX1Md2eiuZwQnGX1qmRayqM5YojSjZP/exec';

        window.showSection = function(sectionId, element, titulo) {
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            if (element) element.classList.add('active');

            document.querySelectorAll('.section-content').forEach(section => section.classList.remove('active'));
            const sec = document.getElementById(sectionId);
            if (sec) sec.classList.add('active');

            document.getElementById('page-title').innerText = titulo;
            
            if (window.appMaps && window.appMaps[sectionId]) {
                setTimeout(() => { window.appMaps[sectionId].invalidateSize(); }, 100);
            }

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.replace('w-64', 'w-0');
            }
        }

        window.parseDinheiro = function(valor) {
            if (valor === null || valor === undefined || valor === '') return 0;
            if (typeof valor === 'number') return valor;
            let vStr = String(valor).trim();
            vStr = vStr.replace(/[R$\s]/gi, '');
            if (vStr.includes(',')) {
                vStr = vStr.replace(/\./g, '').replace(',', '.');
            } else {
                if ((vStr.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(vStr)) {
                    vStr = vStr.replace(/\./g, '');
                }
            }
            let num = parseFloat(vStr.replace(/[^\d.-]/g, ''));
            return isNaN(num) ? 0 : num;
        }

        window.parseCoordinates = function(coordStr) {
            if (!coordStr) return null;
            let simpleMatch = coordStr.match(/(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
            if (simpleMatch) return [parseFloat(simpleMatch[1]), parseFloat(simpleMatch[2])];
            let urlMatch = coordStr.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (urlMatch) return [parseFloat(urlMatch[1]), parseFloat(urlMatch[2])];
            let qMatch = coordStr.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (qMatch) return [parseFloat(qMatch[1]), parseFloat(qMatch[2])];
            return null;
        }

        window.focarNoMapa = function(idSecao, lat, lng) {
            if (window.appMaps && window.appMaps[idSecao]) {
                const map = window.appMaps[idSecao];
                map.flyTo([lat, lng], 18, { animate: true, duration: 1.5 });
                if (window.appMarkers && window.appMarkers[`${idSecao}_${lat}_${lng}`]) {
                    setTimeout(() => { window.appMarkers[`${idSecao}_${lat}_${lng}`].openPopup(); }, 1500); 
                }
            }
        }

        async function carregarDados() {
            try {
                let textoResposta;
                let usandoMock = false;
                
                try {
                    const resposta = await fetch(url, { redirect: 'follow' });
                    if (!resposta.ok) throw new Error("Erro HTTP: " + resposta.status);
                    textoResposta = await resposta.text();
                } catch (fetchErro) {
                    console.warn("Falha de rede ou restrição CORS. Utilizando base demonstrativa local.", fetchErro);
                    usandoMock = true;
                    const mockData = [
                        { "_ABA": "Imóveis", "ORDEM": "1", "IMÓVEL": "Terreno Central - Av. Aurora Forti Neves", "MATRÍCULA": "12345", "ÁREA": "500 m²", "STATUS": "Regular", "ESTIMATIVA": "R$ 150.000,00", "CASA CIVIL": "v", "OBRA": "v", "LICITA": "v", "JURÍDIC": "v", "COORDENADA": "-20.7383, -48.9133", "CADASTRO MUNICIPAL": "11.22.33" },
                        { "_ABA": "Imóveis", "ORDEM": "2", "IMÓVEL": "Prédio Comercial Antigo - Centro", "MATRÍCULA": "67890", "ÁREA": "1200 m²", "STATUS": "Pendente", "ESTIMATIVA": "R$ 850.000,00", "CASA CIVIL": "v", "OBRA": "x aguardando laudo", "LICITA": "-", "JURÍDIC": "-", "COORDENADA": "-20.7400, -48.9100", "CADASTRO MUNICIPAL": "44.55.66" },
                        { "_ABA": "Imóveis", "ORDEM": "3", "IMÓVEL": "Área Industrial Leste - Lote 04", "MATRÍCULA": "99123", "ÁREA": "3500 m²", "STATUS": "Regular", "ESTIMATIVA": "R$ 1.200.000,00", "CASA CIVIL": "v", "OBRA": "v", "LICITA": "Em andamento", "JURÍDIC": "v", "COORDENADA": "-20.7310, -48.8950", "CADASTRO MUNICIPAL": "77.88.99" },
                        
                        { "_ABA": "Lotes Arrematados", "ARREMATANTE": "João Silva Empreendimentos", "LOTE": "01", "LOCAL": "Av. Aurora Forti Neves", "VALOR": "R$ 160.000,00", "ADJUDICAÇÃO E HOMOLOGAÇÃO": "15/05/2026" },
                        { "_ABA": "Lotes Arrematados", "ARREMATANTE": "Construtora Olímpia Ltda", "LOTE": "02", "LOCAL": "Rua São João, 450", "VALOR": "R$ 320.000,00", "ADJUDICAÇÃO E HOMOLOGAÇÃO": "20/06/2026" },
                        { "_ABA": "Lotes Arrematados", "ARREMATANTE": "TOTAL", "LOTE": "2 lotes", "LOCAL": "-", "VALOR": "R$ 480.000,00", "ADJUDICAÇÃO E HOMOLOGAÇÃO": "-" },

                        { "_ABA": "Investimento", "ANO": "Card", "INVESTIMENTO REALIZADO": "Saldo em conta", "VALOR": "R$ 500.000,00" },
                        { "_ABA": "Investimento", "ANO": "Card", "INVESTIMENTO REALIZADO": "Disponível para uso de suplementação", "VALOR": "R$ 200.000,00" },
                        { "_ABA": "Investimento", "ANO": "Card", "INVESTIMENTO REALIZADO": "Saldo livre", "VALOR": "R$ 100.000,00" },
                        { "_ABA": "Investimento", "ANO": "2025", "INVESTIMENTO REALIZADO": "Reforma da Praça Central e Vias Urbanas", "VALOR": "R$ 150.000,00" },
                        { "_ABA": "Investimento", "ANO": "2026", "INVESTIMENTO REALIZADO": "Pavimentação e Infraestrutura Bairro Novo", "VALOR": "R$ 300.000,00" }
                    ];
                    textoResposta = JSON.stringify(mockData);
                }
                
                let dadosBrutos;
                try {
                    dadosBrutos = JSON.parse(textoResposta);
                } catch (parseErro) {
                    throw new Error("Formato de resposta JSON inválido");
                }
                
                let dadosCompletos = Array.isArray(dadosBrutos) ? dadosBrutos : [dadosBrutos];

                let dadosValidos = dadosCompletos.filter(linha => {
                    let temInfo = false;
                    Object.entries(linha).forEach(([k, val]) => {
                        if (k && !k.startsWith('#') && !k.startsWith('_') && String(val).trim() !== '' && String(val).trim() !== '-') {
                            temInfo = true;
                        }
                    });
                    return temInfo;
                });

                // Isolate rows by Tab (_ABA) if property exists
                let dadosImoveis = [];
                let dadosArrematadosRaw = [];
                let dadosInvestimentoRaw = [];

                let temPropAba = dadosValidos.some(l => l['_ABA'] || l['ABA']);

                dadosValidos.forEach(linha => {
                    let abaNorm = normalizeStr(linha['_ABA'] || linha['ABA'] || '');
                    if (abaNorm.includes('ARREMATAD') || abaNorm.includes('LEILAO')) {
                        dadosArrematadosRaw.push(linha);
                    } else if (abaNorm.includes('INVESTIMEN')) {
                        dadosInvestimentoRaw.push(linha);
                    } else {
                        dadosImoveis.push(linha);
                    }
                });

                // If no distinct 'ARREMATAD' tab in _ABA property, check imoveis rows
                if (dadosArrematadosRaw.length === 0) {
                    dadosValidos.forEach(linha => {
                        let abaNorm = normalizeStr(linha['_ABA'] || linha['ABA'] || '');
                        if (!abaNorm.includes('INVESTIMEN')) {
                            let keys = Object.keys(linha);
                            let colArrematados = keys.find(c => normalizeStr(c).includes('ARREMATAD'));
                            let colArrematante = keys.find(c => normalizeStr(c).includes('ARREMATANTE'));
                            let colLote = keys.find(c => normalizeStr(c) === 'LOTE');
                            let colValorPuro = keys.find(c => normalizeStr(c) === 'VALOR');

                            let vStatus = colArrematados ? String(linha[colArrematados] || '').trim().toLowerCase() : '';
                            let temLote = colLote && linha[colLote] && String(linha[colLote]).trim() !== '-' && String(linha[colLote]).trim() !== '';
                            let temArrematante = colArrematante && linha[colArrematante] && String(linha[colArrematante]).trim() !== '-' && String(linha[colArrematante]).trim() !== '';
                            let temValorPuro = colValorPuro && linha[colValorPuro] && String(linha[colValorPuro]).trim() !== '-' && String(linha[colValorPuro]).trim() !== '';
                            let temV = vStatus === 'v' || vStatus.startsWith('v ') || /^v[-]?\d/.test(vStatus) || vStatus === 'sim';

                            if (temV || temArrematante || temLote || temValorPuro) {
                                dadosArrematadosRaw.push(linha);
                            }
                        }
                    });
                }

                // Extract Imóveis main TOTAL row if present
                let linhaTotalImoveis = dadosImoveis.find(linha => {
                    let keys = Object.keys(linha);
                    let colImovel = keys.find(k => normalizeStr(k) === 'IMOVEL');
                    let colOrdem = keys.find(k => normalizeStr(k) === 'ORDEM');
                    const valImovel = colImovel ? String(linha[colImovel] || '').toUpperCase().trim() : '';
                    const valOrdem = colOrdem ? String(linha[colOrdem] || '').toUpperCase().trim() : '';
                    return valImovel === 'TOTAL' || valImovel.startsWith('TOTAL ') || valImovel.startsWith('TOTAL:') || valOrdem === 'TOTAL';
                });

                let dados = dadosImoveis.filter(linha => linha !== linhaTotalImoveis);

                if (dadosValidos.length > 0) {
                    const menuLateral = document.getElementById('menu-lateral');
                    const conteinerSecoes = document.getElementById('conteiner-secoes');

                    menuLateral.innerHTML = '';
                    conteinerSecoes.innerHTML = '';

                    const colunasSet = new Set();
                    dadosValidos.forEach(linha => Object.keys(linha).forEach(chave => {
                        if (chave && !chave.startsWith('#') && !chave.startsWith('_')) {
                            colunasSet.add(chave);
                        }
                    }));
                    const todasColunas = Array.from(colunasSet);

                    const getCol = (nomesArray) => {
                        return todasColunas.find(c => {
                            let cleanC = normalizeStr(c);
                            return nomesArray.some(nome => cleanC.includes(normalizeStr(nome)));
                        });
                    };

                    const chavesSetores = ['CASA CIVIL', 'PATRIM', 'OBRA', 'LICITA', 'JURIDIC', 'PUBLICA', 'PEDIDO'];
                    let colunasReaisSetores = todasColunas.filter(c => chavesSetores.some(chave => normalizeStr(c).includes(chave)));
                    
                    const colPedidos = colunasReaisSetores.filter(c => normalizeStr(c).includes('PEDIDO'));
                    if (colPedidos.length > 0) {
                        colunasReaisSetores = colunasReaisSetores.filter(c => !normalizeStr(c).includes('PEDIDO'));
                        let idxLicitacao = colunasReaisSetores.findIndex(c => normalizeStr(c).includes('LICITA'));
                        
                        if (idxLicitacao !== -1) {
                            colunasReaisSetores.splice(idxLicitacao, 0, ...colPedidos);
                        } else {
                            let idxObras = colunasReaisSetores.findIndex(c => normalizeStr(c).includes('OBRA'));
                            if (idxObras !== -1) {
                                colunasReaisSetores.splice(idxObras + 1, 0, ...colPedidos);
                            } else {
                                colunasReaisSetores.push(...colPedidos);
                            }
                        }
                    }

                    const colunaPagamentoOriginal = todasColunas.find(c => {
                        let cn = normalizeStr(c);
                        return cn.includes('PAGAMENTO') && !cn.includes('ESTIMATIVA') && !cn.includes('VALOR');
                    });
                    const colunaCadastro = getCol(['CADASTRO MUNICIPAL']);

                    const colArrematados = getCol(['ARREMATADOS', 'ARREMATADO']);
                    const colLote = todasColunas.find(c => normalizeStr(c) === 'LOTE');
                    const colArrematante = getCol(['ARREMATANTE']);
                    const colLocal = todasColunas.find(c => normalizeStr(c) === 'LOCAL');
                    const colValorPuro = todasColunas.find(c => normalizeStr(c) === 'VALOR');
                    const colDataAdj = getCol(['ADJUDICACAO', 'HOMOLOGACAO']);
                    const colImovelPrincipal = getCol(['IMOVEL']);
                    
                    const colDataAntiga = todasColunas.find(c => normalizeStr(c) === 'DATA');
                    const colValorArremateAntigo = todasColunas.find(c => normalizeStr(c).includes('VALOR') && normalizeStr(c).includes('ARREMAT'));

                    if (colArrematados && !colunasReaisSetores.includes(colArrematados)) {
                        colunasReaisSetores.push(colArrematados);
                    }

                    const idSecaoVisaoGeral = 'secao-visao-geral';
                    let sum2025 = 0, count2025 = 0;
                    let sum2026 = 0, count2026 = 0;
                    let sumTotal = 0, countTotal = 0;
                    let sumEstimativa = 0, countEstimativa = 0;

                    const colEstimativaGeral = todasColunas.find(c => {
                        let n = normalizeStr(c);
                        return n.includes('ESTIMATIVA') || n.includes('AVALIACAO');
                    });

                    // Calculate totals for Arrematados
                    dadosArrematadosRaw.forEach(linha => {
                        let arrematanteVal = colArrematante ? String(linha[colArrematante] || '').trim() : '';
                        let imovelVal = colImovelPrincipal ? String(linha[colImovelPrincipal] || '').trim() : '';
                        let isTotalRow = normalizeStr(arrematanteVal).startsWith('TOTAL') || normalizeStr(imovelVal).startsWith('TOTAL');

                        if (!isTotalRow) {
                            let vValorFinal = (colValorPuro && linha[colValorPuro]) ? linha[colValorPuro] : (colValorArremateAntigo ? linha[colValorArremateAntigo] : null);
                            let numValor = window.parseDinheiro(vValorFinal);
                            let vDataFinal = (colDataAdj && linha[colDataAdj]) ? linha[colDataAdj] : (colDataAntiga ? linha[colDataAntiga] : null);
                            let strDate = String(vDataFinal || '').trim();

                            if (numValor > 0) {
                                sumTotal += numValor;
                                countTotal++;
                                if (strDate.includes('2025')) { sum2025 += numValor; count2025++; }
                                else if (strDate.includes('2026')) { sum2026 += numValor; count2026++; }
                                else { sum2026 += numValor; count2026++; }
                            }
                        }
                    });

                    dados.forEach(linha => {
                        if (colEstimativaGeral) {
                            let valEst = window.parseDinheiro(linha[colEstimativaGeral]);
                            if (valEst > 0) {
                                sumEstimativa += valEst;
                                countEstimativa++;
                            }
                        }
                    });

                    const fmtCur = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
                    
                    menuLateral.innerHTML += `
                        <a href="#" onclick="showSection('${idSecaoVisaoGeral}', this, 'Visão Geral dos Resultados')" class="nav-link flex items-center space-x-3 p-3 text-gold hover:bg-blue-800 mb-1">
                            <i class="fa-solid fa-chart-line w-6 text-center"></i>
                            <span class="truncate text-[11px] font-bold tracking-wider uppercase">Visão Geral dos Resultados</span>
                        </a>
                    `;

                    conteinerSecoes.innerHTML += `
                        <section id="${idSecaoVisaoGeral}" class="section-content">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 mt-2">
                                <div class="card p-5 border-l-4 border-gray-400 shadow-sm flex flex-col justify-center">
                                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Imóveis 2025</p>
                                    <h3 class="text-lg lg:text-xl font-black text-navy mt-1">${fmtCur.format(sum2025)}</h3>
                                    <p class="text-[11px] font-bold text-gray-400 mt-1"><i class="fa-solid fa-layer-group mr-1"></i> ${count2025} lote(s)</p>
                                </div>
                                <div class="card p-5 border-l-4 border-blue-500 shadow-sm flex flex-col justify-center">

                        }

                        conteinerSecoes.innerHTML += `
                            <section id="${idSecaoInvestimento}" class="section-content">
                                <!-- Section Introductory Explanation -->
                                <div class="card p-5 mb-6 border-l-4 border-navy bg-blue-50/40">
                                    <h3 class="text-xs font-bold text-navy uppercase tracking-wider mb-1"><i class="fa-solid fa-circle-info mr-2 text-gold"></i> Contexto da Seção</h3>
                                    <p class="text-xs text-slate-600 leading-relaxed">
                                        Visão panorâmica da aplicação dos recursos arrecadados e saldos disponíveis em conta para suplementação orçamentária e obras municipais nos exercícios de 2025 e 2026.
                                    </p>
                                </div>

                                ${cardsHtmlInv}
                                ${gridsHtml}
                            </section>
                        `;
                    }

                    const primeiroLink = document.querySelector('.nav-link');
                    if (primeiroLink) { primeiroLink.click(); }

                    if (usandoMock) {
                        document.getElementById('page-title').innerHTML += ' <span class="text-[9px] bg-amber-500 text-white px-2 py-0.5 rounded ml-2 align-middle font-bold" title="Usando base local demonstrativa">MODO DEMO</span>';
                    }

                    // Render Overview Charts
                    const canvasVisaoValores = document.getElementById('chart-visao-valores');
                    const canvasVisaoLotes = document.getElementById('chart-visao-lotes');

                    if (canvasVisaoValores) {
                        new Chart(canvasVisaoValores.getContext('2d'), {
                            type: 'line',
                            data: {
                                labels: ['2025', '2026', 'Previsões Próximos Leilões'],
                                datasets: [{
                                    label: 'Valor (R$)',
                                    data: [sum2025, sum2026, sumEstimativa],
                                    borderColor: '#003366',
                                    backgroundColor: 'rgba(0, 51, 102, 0.1)',
                                    borderWidth: 3,
                                    pointBackgroundColor: ['#9ca3af', '#3b82f6', '#22c55e'],
                                    pointBorderColor: '#ffffff',
                                    pointBorderWidth: 2,
                                    pointRadius: 6,
                                    pointHoverRadius: 8,
                                    fill: true,
                                    tension: 0.3
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        backgroundColor: 'rgba(0, 51, 102, 0.95)',
                                        titleFont: { family: "'Poppins', sans-serif", size: 12, weight: 'bold' },
                                        bodyFont: { family: "'Poppins', sans-serif", size: 11 },
                                        padding: 10, cornerRadius: 8,
                                        callbacks: {
                                            label: function(context) {
                                                return fmtCur.format(context.raw);
                                            }
                                        }
                                    }
                                },
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: {
                                            font: { family: "'Poppins', sans-serif", size: 10 },
                                            callback: function(value) {
                                                if (value >= 1000000) return 'R$ ' + (value / 1000000).toFixed(1) + 'M';
                                                if (value >= 1000) return 'R$ ' + (value / 1000).toFixed(0) + 'k';
                                                return 'R$ ' + value;
                                            }
                                        }
                                    },
                                    x: { ticks: { font: { family: "'Poppins', sans-serif", size: 11, weight: 'bold' } } }
                                }
                            }
                        });
                    }

                    if (canvasVisaoLotes) {
                        new Chart(canvasVisaoLotes.getContext('2d'), {
                            type: 'pie',
                            data: {
                                labels: ['Imóveis 2025', 'Imóveis 2026', 'Previsões Próximos Leilões'],
                                datasets: [{
                                    data: [count2025, count2026, countEstimativa],
                                    backgroundColor: ['#9ca3af', '#3b82f6', '#22c55e'],
                                    borderWidth: 1,
                                    borderColor: '#ffffff'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { position: 'bottom', labels: { font: { family: "'Poppins', sans-serif", size: 11 }, boxWidth: 12, padding: 12 } },
                                    tooltip: {
                                        backgroundColor: 'rgba(0, 51, 102, 0.95)',
                                        titleFont: { family: "'Poppins', sans-serif", size: 12, weight: 'bold' },
                                        bodyFont: { family: "'Poppins', sans-serif", size: 11 },
                                        padding: 10, cornerRadius: 8,
                                        callbacks: {
                                            label: function(context) {
                                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                                const porcentagem = total > 0 ? ((context.raw / total) * 100).toFixed(1) : 0;
                                                return [`Quantidade: ${context.raw} imóvel(is)`, `Representa: ${porcentagem}% do total`];
                                            }
                                        }
                                    }
                                }
                            }
                        });
                    }

                    const canvasSetorAtual = document.getElementById('chart-setor-atual');
                    if (canvasSetorAtual && labelsSetorAtual.length > 0) {
                        const gerarCoresSetor = (qtd) => {
                            const paleta = ['#003366', '#ffb800', '#16a34a', '#dc2626', '#2563eb', '#9333ea', '#ea580c', '#14b8a6', '#f43f5e', '#8b5cf6'];
                            let cores = [];
                            for(let i=0; i<qtd; i++) cores.push(paleta[i % paleta.length]);
                            return cores;
                        };

                        new Chart(canvasSetorAtual.getContext('2d'), {
                            type: 'pie',
                            data: {
                                labels: labelsSetorAtual,
                                datasets: [{
                                    label: 'Quantidade',
                                    data: valuesSetorAtual,
                                    backgroundColor: gerarCoresSetor(labelsSetorAtual.length),
                                    borderWidth: 1,
                                    borderColor: '#ffffff'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: {
                                        display: labelsSetorAtual.length <= 20,
                                        position: 'right',
                                        labels: { font: { family: "'Poppins', sans-serif", size: 10 }, boxWidth: 12, padding: 8 }
                                    },
                                    tooltip: {
                                        backgroundColor: 'rgba(0, 51, 102, 0.95)',
                                        titleFont: { family: "'Poppins', sans-serif", size: 12, weight: 'bold' },
                                        bodyFont: { family: "'Poppins', sans-serif", size: 11 },
                                        padding: 10, cornerRadius: 8, displayColors: true,
                                        callbacks: {
                                            label: function(context) {
                                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                                const porcentagem = total > 0 ? ((context.raw / total) * 100).toFixed(1) : 0;
                                                return [`Quantidade: ${context.raw} imóvel(is)`, `Representa: ${porcentagem}% do total`];
                                            }
                                        }
                                    }
                                }
                            }
                        });
                    }

                    colunasMenu.forEach((coluna, index) => {
                        const idSecao = 'secao-' + index;
                        const cNorm = normalizeStr(coluna);
                        const isCoordenadasTab = cNorm.includes('COORDENADA');

                        if (isCoordenadasTab) {
                            const mapContainer = document.getElementById(`map-${idSecao}`);
                            if (mapContainer) {
                                window.appMaps = window.appMaps || {};
                                
                                const map = L.map(mapContainer).setView([-20.7383, -48.9133], 13);
                                const mapaRuas = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                                    maxZoom: 20,
                                    attribution: '© Google'
                                });
                                const mapaSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                                    maxZoom: 20,
                                    attribution: '© Google'
                                });

                                mapaRuas.addTo(map);
                                L.control.layers({
                                    "Modo Mapa (Claro)": mapaRuas,
                                    "Modo Satélite": mapaSatelite
                                }).addTo(map);

                                let bounds = L.latLngBounds();
                                let hasValidMarkers = false;

                                window.appMarkers = window.appMarkers || {};

                                const customIcon = L.divIcon({
                                    className: 'custom-marker',
                                    html: `<div class="bg-navy text-gold w-8 h-8 flex items-center justify-center rounded-full shadow-lg border-2 border-gold hover:bg-gold hover:text-navy transition-all duration-300 relative group cursor-pointer"><i class="fa-solid fa-location-dot text-[14px]"></i><div class="absolute -bottom-[5px] left-1/2 w-2.5 h-2.5 bg-navy border-b-2 border-r-2 border-gold transform rotate-45 -translate-x-1/2 group-hover:bg-gold transition-colors duration-300"></div></div>`,
                                    iconSize: [32, 38],
                                    iconAnchor: [16, 38],
                                    popupAnchor: [0, -40]
                                });

                                dados.forEach(d => {
                                    let imovelLimpo = escapeHTML(d[colImovelPrincipal] || d['IMÓVEL'] || d['IMOVEL'] || '-');
                                    if (imovelLimpo === '-' && !(colArrematante && d[colArrematante])) return; 

                                    let coordStr = String(d[coluna] || '').trim();
                                    let coords = window.parseCoordinates(coordStr);

                                    if (coords && coords.length === 2) {
                                        let lat = coords[0];
                                        let lng = coords[1];
                                        if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                                            let marker = L.marker([lat, lng], {icon: customIcon}).addTo(map)
                                                .bindPopup(`
                                                    <div class="p-1 text-center min-w-[150px]">
                                                        <div class="font-black text-[11px] uppercase tracking-wider text-navy mb-2 pb-1 border-b-2 border-gold inline-block">${imovelLimpo}</div>
                                                        <div class="text-[9px] font-bold text-gray-500 bg-gray-50 rounded px-2 py-1.5 border border-gray-200 inline-block w-full"><i class="fa-solid fa-map-pin text-gold mr-1"></i> ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
                                                    </div>
                                                `, { className: 'modern-map-popup' })
                                                .bindTooltip(`<div class="font-bold text-[10px] uppercase text-navy">${imovelLimpo}</div>`, {
                                                    direction: 'top', 
                                                    offset: [0, -40],
                                                    opacity: 0.95
                                                });
                                            window.appMarkers[`${idSecao}_${lat}_${lng}`] = marker;
                                            bounds.extend([lat, lng]);
                                            hasValidMarkers = true;
                                        }
                                    }
                                });

                                if (hasValidMarkers) {
                                    setTimeout(() => { map.fitBounds(bounds, { padding: [50, 50] }); }, 500);
                                }
                                window.appMaps[idSecao] = map;
                            }
                        } 
                        else {
                            const canvas = document.getElementById(`chart-${idSecao}`);
                            if(canvas) {
                                const isPizza = ['AREA', 'ESTIMATIVA', 'VALOR', 'R$', 'AVALIACAO', 'ALIENACAO', 'PERMUTA', 'DESAPROPRIACAO'].some(c => cNorm.includes(c));
                                const isEstimativaTab = cNorm.includes('ESTIMATIVA') || cNorm.includes('VALOR') || cNorm.includes('R$') || cNorm.includes('AVALIACAO');
                                
                                let labels = [];
                                let values = [];

                                if (isEstimativaTab) {
                                    let valPen = 0, valIniStrict = 0, valAnd = 0, valCon = 0;
                                    
                                    dados.forEach(d => {
                                        let imovelLimpo = escapeHTML(d[colImovelPrincipal] || d['IMÓVEL'] || d['IMOVEL'] || '-');
                                        if (imovelLimpo === '-' && !(colArrematante && d[colArrematante])) return; 

                                        let num = window.parseDinheiro(d[coluna]);
                                        let isBlank = true, hasX = false, lastIsV = false;
                                        for (let j = colunasReaisSetores.length - 1; j >= 0; j--) {
                                            let valCell = String(d[colunasReaisSetores[j]] || '').trim().toLowerCase();
                                            if (valCell !== '' && valCell !== '-' && valCell !== '.' && valCell !== 'n/a') {
                                                if (isBlank) {
                                                    if (valCell === 'v' || valCell === 'ok' || valCell === 'sim' || valCell.includes('concluí') || valCell.startsWith('v ') || /^v[-]?\d/.test(valCell)) lastIsV = true;
                                                }
                                                isBlank = false;
                                                if (valCell === 'x' || valCell.includes('pendente') || valCell.includes('parado') || valCell.startsWith('x ') || /^x[-]?\d/.test(valCell)) hasX = true;
                                            }
                                        }
                                        if (isBlank) valPen += num;
                                        else if (lastIsV) valCon += num;
                                        else if (hasX) valAnd += num;
                                        else valIniStrict += num;
                                    });

                                    if (valPen > 0) { labels.push('Pendente'); values.push(valPen); }
                                    if (valIniStrict > 0) { labels.push('Apenas Iniciado'); values.push(valIniStrict); }
                                    if (valAnd > 0) { labels.push('Em Andamento'); values.push(valAnd); }
                                    if (valCon > 0) { labels.push('Concluído'); values.push(valCon); }
                                } else {
                                    const contagem = {};
                                    dados.forEach(d => {
                                        let imovelLimpo = escapeHTML(d[colImovelPrincipal] || d['IMÓVEL'] || d['IMOVEL'] || '-');
                                        if (imovelLimpo === '-' && !(colArrematante && d[colArrematante])) return; 

                                        let v = escapeHTML(String(d[coluna] || 'Não Informado').trim());
                                        if(v.length > 35) v = v.substring(0, 35) + '...';
                                        contagem[v] = (contagem[v] || 0) + 1;
                                    });
                                    labels = Object.keys(contagem);
                                    values = Object.values(contagem);
                                }
                                
                                if (!isPizza && labels.length > 15 && labels.length >= (dados.length * 0.5)) {
                                    document.getElementById(`wrapper-chart-${idSecao}`).innerHTML = `
                                        <div class="flex flex-col items-center justify-center h-full text-center text-gray-400 italic px-6 text-xs">
                                            <i class="fa-solid fa-circle-info text-2xl mb-2 text-gray-300"></i>
                                            <p>Esta métrica possui dados exclusivos para quase cada imóvel, tornando a exibição em gráfico inviável.</p>
                                        </div>
                                    `;
                                    return;
                                }

                                const gerarCores = (qtd) => {
                                    const paleta = ['#003366', '#ffb800', '#16a34a', '#dc2626', '#2563eb', '#9333ea', '#ea580c', '#14b8a6', '#f43f5e', '#8b5cf6'];
                                    let cores = [];
                                    for(let i=0; i<qtd; i++) cores.push(paleta[i % paleta.length]);
                                    return cores;
                                };

                                let tipoGrafico = labels.length > 7 ? 'bar' : 'doughnut';
                                if (isPizza) tipoGrafico = 'pie';
                                
                                new Chart(canvas.getContext('2d'), {
                                    type: tipoGrafico,
                                    data: {
                                        labels: labels,
                                        datasets: [{
                                            label: 'Quantidade',
                                            data: values,
                                            backgroundColor: gerarCores(labels.length),
                                            borderWidth: (tipoGrafico === 'bar' && labels.length > 7) ? 0 : 1,
                                            borderColor: '#ffffff'
                                        }]
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: false,
                                        plugins: {
                                            legend: {
                                                display: labels.length <= 20,
                                                position: 'right',
                                                labels: { font: { family: "'Poppins', sans-serif", size: 10 }, boxWidth: 12, padding: 8 }
                                            },
                                            tooltip: {
                                                backgroundColor: 'rgba(0, 51, 102, 0.95)',
                                                titleFont: { family: "'Poppins', sans-serif", size: 12, weight: 'bold' },
                                                bodyFont: { family: "'Poppins', sans-serif", size: 11 },
                                                padding: 10, cornerRadius: 8, displayColors: true,
                                                callbacks: {
                                                    title: function(tooltipItems) { return tooltipItems[0].label; },
                                                    label: function(context) {
                                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                                        const porcentagem = total > 0 ? ((context.raw / total) * 100).toFixed(1) : 0;
                                                        if (isEstimativaTab) {
                                                            return [`Valor Total: ${fmtCur.format(context.raw)}`, `Representa: ${porcentagem}%`];
                                                        }
                                                        return [`Quantidade: ${context.raw} imóvel(is)`, `Representa: ${porcentagem}% do total`];
                                                    }
                                                }
                                            }
                                        },
                                        scales: tipoGrafico === 'bar' ? { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { display: false } } : undefined
                                    }
                                });
                            }
                        }
                    });

                }
            } catch (erro) {
                console.error(erro);
                document.getElementById('conteiner-secoes').innerHTML = `
                    <div class="text-center p-10 card w-full max-w-lg mx-auto mt-10">
                        <i class="fa-solid fa-triangle-exclamation text-red-500 text-5xl mb-4"></i>
                        <h2 class="text-lg font-bold text-navy">Erro ao Carregar Dados da Planilha</h2>
                        <p class="text-xs text-gray-600 mt-2">Não foi possível conectar ao Google Apps Script. Por favor, verifique as permissões de acesso da API ou tente novamente em instantes.</p>
                    </div>
                `;
            }
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
